<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050714">
  <meta name="description" content="音に合わせて動く光の群れと、瞬く星空。">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/192x192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/192x192.png">
  <link rel="stylesheet" href="./style.css?v=2026.10.18.12">
  <title>Starlight Bell</title>
  <script src="./app.js?v=2026.10.18.12" defer></script>
</head>
<body>
  <main id="sky" aria-label="音に反応する光のアニメーション">
    <canvas id="canvas" aria-label="周波数とリズムに合わせて動く光の球の群れ"></canvas>
    <canvas id="lane-transition" aria-hidden="true"></canvas>
    <div id="theme" role="status" aria-live="polite" aria-atomic="true"><span id="theme-number">01 / 02</span><strong id="theme-title">光の群れ</strong><span id="theme-description">音の流れを、光の翼に。</span></div>
    <p id="version" aria-label="アプリのバージョン">読み込み中…</p>
    <div id="intro"><p class="eyebrow">STARLIGHT BELL</p><h1 id="intro-title">音を、光の動きに。</h1><p>下の「開始」を押して<br>音の流れを眺める</p></div>
    <p id="notice" role="status" aria-live="polite"></p>
  </main>
  <div id="microphone-controls">
    <button id="choose-microphone" type="button" aria-haspopup="dialog">使用マイク指定</button>
    <p id="microphone-name" role="status" aria-live="polite">未指定（自動選択）</p>
  </div>
  <dialog id="microphone-dialog" aria-labelledby="microphone-dialog-title" aria-describedby="microphone-prompt">
    <h2 id="microphone-dialog-title">使用マイク指定</h2>
    <p id="microphone-prompt" role="status" aria-live="polite"></p>
    <div id="microphone-choices"></div>
    <button id="close-microphone-dialog" type="button">閉じる</button>
  </dialog>
  <footer aria-label="観測の操作">
    <button id="previous-mode" class="mode-arrow" type="button" aria-label="前のアニメーション：星空"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <button id="start" type="button">開始</button>
    <button id="stop" type="button" disabled>終了</button>
    <button id="next-mode" class="mode-arrow" type="button" aria-label="次のアニメーション：星空"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
  </footer>
</body>
</html>
