<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050714">
  <meta name="description" content="音に呼応して瞬く、あなただけの夜空。">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/192x192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/192x192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Starlight Bell</title>
  <script src="./app.js" defer></script>
</head>
<body>
  <main id="sky" aria-label="音に反応する星空">
    <canvas id="canvas" aria-label="96個の星が音の周波数に応じて瞬きます"></canvas>
    <div id="intro"><p class="eyebrow">STARLIGHT BELL</p><h1>音を、星空に。</h1><p>下の「開始」を押して<br>夜空を観測する</p></div>
    <p id="notice" role="status" aria-live="polite"></p>
  </main>
  <footer aria-label="観測の操作">
    <button id="start" type="button">開始</button>
    <button id="stop" type="button" disabled>終了</button>
  </footer>
</body>
</html>
